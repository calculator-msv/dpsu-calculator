<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>База ТЗ - Керування</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1b3022; color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 340px; background: rgba(0,0,0,0.4); padding: 20px; border-right: 2px solid #2ecc71; display: flex; flex-direction: column; box-sizing: border-box; overflow-y: auto; }
        .main-container { flex-grow: 1; padding: 20px; overflow-y: auto; background: rgba(255,255,255,0.02); }
        
        h2 { color: #2ecc71; font-size: 18px; text-transform: uppercase; border-bottom: 1px solid rgba(46,204,113,0.3); padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 10px; }
        .form-group label { font-size: 10px; color: #bdc3c7; display: block; margin-bottom: 3px; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border-radius: 4px; border: none; font-weight: bold; box-sizing: border-box; background: #fff; color: #000; font-size: 12px; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 10px 0; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 4px; cursor: pointer; }
        .checkbox-group input { width: auto; cursor: pointer; }
        .checkbox-group label { font-size: 11px; color: #f1c40f; margin: 0; cursor: pointer; }

        .btn-save { background: #27ae60; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; width: 100%; margin-top: 10px; transition: 0.2s; font-size: 13px; }
        .btn-save:hover { background: #2ecc71; box-shadow: 0 0 10px rgba(46,204,113,0.4); }
        .btn-back { background: #34495e; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; width: 100%; margin-top: 15px; text-decoration: none; display: block; text-align: center; font-size: 11px; }

        .top-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 6px; }
        .category-block { background: rgba(0,0,0,0.2); border: 1px dashed rgba(46,204,113,0.4); border-radius: 8px; padding: 12px; margin-bottom: 15px; min-height: 80px; }
        .category-title { font-size: 14px; font-weight: bold; color: #f1c40f; margin-bottom: 10px; text-transform: uppercase; display: flex; justify-content: space-between; }

        .car-card { background: rgba(255,255,255,0.08); margin-bottom: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); cursor: grab; position: relative; transition: 0.2s; animation: fadeIn 0.3s; }
        .car-card:hover { border-color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .car-card.dragging { opacity: 0.4; }
        
        .car-main-info { padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .car-name { font-size: 14px; font-weight: bold; color: #2ecc71; }
        .car-plate { font-size: 12px; background: #fff; color: #000; padding: 2px 6px; border-radius: 3px; font-weight: bold; margin-left: 8px; }
        
        .car-details { display: none; padding: 12px; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.1); border-radius: 0 0 6px 6px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; color: #ecf0f1; }
        .detail-grid b { color: #f1c40f; }
        
        .btn-mini-del { position: absolute; top: 10px; right: 10px; background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 5; }
        .btn-mini-del:hover { background: #e74c3c; color: #fff; }
        
        .btn-select-calc { background: #2980b9; color: white; border: none; padding: 10px; border-radius: 4px; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 11px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>➕ Нове авто</h2>
    
    <div class="form-group">
        <label>Марка та Модель ТЗ:</label>
        <input type="text" id="n_name" placeholder="Напр: ГАЗ-66">
    </div>

    <div class="form-group">
        <label>Номерний знак:</label>
        <input type="text" id="n_plate" placeholder="Напр: ВВ 0001 АА">
    </div>

    <div class="form-group">
        <label>Вид / Категорія ТЗ:</label>
        <select id="n_category"></select>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="form-group"><label>Hs (л/100км):</label><input type="number" id="n_hsm" step="0.01" value="0.0"></div>
        <div class="form-group"><label>Hw (л/100т·км):</label><input type="number" id="n_hw" step="0.01" value="1.3"></div>
    </div>

    <div class="checkbox-group" onclick="document.getElementById('n_has_cargo').click()">
        <input type="checkbox" id="n_has_cargo" onclick="event.stopPropagation(); toggleCargoInput()">
        <label>Вантажний ТЗ</label>
    </div>
    <div class="form-group" id="cargo_input_box" style="display: none;">
        <label>Макс. вантажопідйомність(тонн):</label>
        <input type="number" id="n_max_payload" step="0.1" value="4.5">
    </div>

    <div class="checkbox-group" onclick="document.getElementById('n_has_adblue').click()">
        <input type="checkbox" id="n_has_adblue" onclick="event.stopPropagation(); toggleAdBlueInput()">
        <label>Використовує AdBlue</label>
    </div>
    <div class="form-group" id="adblue_input_box" style="display: none;">
        <label>Норма AdBlue (% від пального):</label>
        <input type="number" id="n_adblue_rate" step="0.1" value="4.0">
    </div>
    
    <div style="font-size: 9px; color: #2ecc71; margin-top: 5px; text-align: center; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">НОРМИ ОЛИВ (л) на 100 л ПАЛИВА</div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 5px;">
        <div class="form-group"><label>Мот. (M):</label><input type="number" id="n_om" step="0.01" value="2.7"></div>
        <div class="form-group"><label>Транс. (T):</label><input type="number" id="n_ot" step="0.01" value="0.3"></div>
        <div class="form-group"><label>Спец. (S):</label><input type="number" id="n_os" step="0.01" value="0.1"></div>
        <div class="form-group"><label>Пласт. (P):</label><input type="number" id="n_op" step="0.01" value="0.2"></div>
    </div>
    
    <button class="btn-save" onclick="addCar()">💾 Зберегти в базу</button>
    
    <a href="calc.html" class="btn-back">← На головну (Розрахунок)</a>
</div>

<div class="main-container">
    <div class="top-toolbar">
        <div>
            <button onclick="addCustomCategory()" style="background:#8e44ad; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:11px;">➕ Створити новий вид ТЗ</button>
        </div>
        <div>
            <span style="font-size:11px; color:#aaa; margin-right:5px;">Сортування:</span>
            <button onclick="sortCars('name')" style="background:#34495e; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:11px;">За назвою (А-Я)</button>
        </div>
    </div>

    <div id="categoryContainer"></div>
</div>

<!-- 1. Підключення SDK Firebase (CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- 2. Підключення вашої конфігурації -->
<script src="firebase-config.js"></script>

<!-- 3. Оновлена логіка роботи з базою -->
<script>
    let categories = JSON.parse(localStorage.getItem('car_categories')) || ["Вантажні", "Легкові", "Спеціальні"];

    // Синхронізація зі станом авторизації Firebase
    auth.onAuthStateChanged((user) => {
        if (user) {
            // Зберігаємо сесію
            localStorage.setItem('currentUser', JSON.stringify({
                uid: user.uid,
                email: user.email,
                username: user.displayName || user.email
            }));
            render();
        } else {
            // Якщо не авторизований у Firebase, перевіряємо гостьовий/локальний режим
            const localUser = localStorage.getItem('currentUser');
            if (!localUser) {
                window.location.href = 'index.html';
            } else {
                render();
            }
        }
    });

    function toggleCargoInput() {
        const checked = document.getElementById('n_has_cargo').checked;
        document.getElementById('cargo_input_box').style.display = checked ? 'block' : 'none';
    }

    function toggleAdBlueInput() {
        const checked = document.getElementById('n_has_adblue').checked;
        document.getElementById('adblue_input_box').style.display = checked ? 'block' : 'none';
    }

    function updateCategorySelect() {
        const select = document.getElementById('n_category');
        if (!select) return;
        select.innerHTML = '';
        categories.forEach(cat => {
            select.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
    }

    // ДОДАВАННЯ АВТОМОБІЛЯ (БЕЗ ПОМИЛКИ ВХОДУ)
    async function addCar() {
        const name = document.getElementById('n_name').value.trim();
        const plate = document.getElementById('n_plate').value.trim();
        
        if (!name) {
            alert("Помилка: Введіть марку/модель автомобіля!");
            return;
        }

        const user = auth.currentUser;
        const localUser = JSON.parse(localStorage.getItem('currentUser'));

        if (!user && !localUser) {
            alert("Помилка: Сесія закінчилася. Будь ласка, увійдіть знову!");
            window.location.href = 'index.html';
            return;
        }

        const hasCargo = document.getElementById('n_has_cargo').checked;
        const hasAdBlue = document.getElementById('n_has_adblue').checked;

        const id = name + (plate ? "_" + plate : "");

        const carData = {
            id: id,
            name: name,
            plate: plate || "Б/Н",
            category: document.getElementById('n_category').value,
            hsm: parseFloat(document.getElementById('n_hsm').value) || 0,
            hsz: parseFloat(document.getElementById('n_hw').value) || 0,
            hasCargo: hasCargo,
            maxPayload: hasCargo ? (parseFloat(document.getElementById('n_max_payload').value) || 0) : 0,
            hasAdBlue: hasAdBlue,
            adBlueRate: hasAdBlue ? (parseFloat(document.getElementById('n_adblue_rate').value) || 0) : 0,
            om: parseFloat(document.getElementById('n_om').value) || 0,
            ot: parseFloat(document.getElementById('n_ot').value) || 0,
            os: parseFloat(document.getElementById('n_os').value) || 0,
            op: parseFloat(document.getElementById('n_op').value) || 0
        };

        // 1. Локальне збереження для миттєвого відображення в калькуляторі
        let localDb = JSON.parse(localStorage.getItem('cars')) || {};
        localDb[id] = carData;
        localStorage.setItem('cars', JSON.stringify(localDb));

        // 2. Хмарне збереження у Firestore
        if (user) {
            try {
                await db.collection('users').doc(user.uid).collection('cars').doc(id).set(carData);
            } catch (err) {
                console.error("Помилка запису у хмару:", err);
            }
        }

        document.getElementById('n_name').value = "";
        document.getElementById('n_plate').value = "";
        
        render();
        alert("Автомобіль успішно збережено!");
    }

    // РЕНДЕР СПИСКУ АВТОМОБІЛІВ
    async function render() {
        updateCategorySelect();
        const user = auth.currentUser;
        let dbCars = JSON.parse(localStorage.getItem('cars')) || {};

        // Завантаження з хмари, якщо користувач авторизований
        if (user) {
            try {
                const snapshot = await db.collection('users').doc(user.uid).collection('cars').get();
                if (!snapshot.empty) {
                    dbCars = {};
                    snapshot.forEach(doc => {
                        dbCars[doc.id] = doc.data();
                    });
                    localStorage.setItem('cars', JSON.stringify(dbCars));
                }
            } catch (e) {
                console.log("Завантажено з локальної пам'яті");
            }
        }

        const container = document.getElementById('categoryContainer');
        if (!container) return;
        container.innerHTML = "";

        if (Object.keys(dbCars).length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#777; margin-top:50px;">База автомобілів порожня. Додайте перше авто ліворуч.</div>';
            return;
        }

        categories.forEach(cat => {
            const catBox = document.createElement('div');
            catBox.className = 'category-block';

            let html = `<div class="category-title">
                            <span>📁 ${cat}</span>
                        </div>`;

            let hasCars = false;
            for (let id in dbCars) {
                const car = dbCars[id];
                if ((car.category || "Вантажні") === cat) {
                    hasCars = true;
                    html += `
                        <div class="car-card" onclick="toggleDetails('${id}')">
                            <button class="btn-mini-del" onclick="event.stopPropagation(); deleteCar('${id}')">✕</button>
                            <div class="car-main-info">
                                <div>
                                    <span class="car-name">🚗 ${car.name}</span>
                                    <span class="car-plate">${car.plate || 'Б/Н'}</span>
                                </div>
                                <span style="color:#888; font-size:10px; text-transform:uppercase;">Детальніше ▾</span>
                            </div>
                            <div id="details-${id}" class="car-details">
                                <div class="detail-grid">
                                    <span><b>Hs:</b> ${car.hsm} л</span>
                                    <span><b>Hw:</b> ${car.hsz || 0} л</span>
                                    <span><b>Моторна (M):</b> ${car.om} л</span>
                                    <span><b>Трансм. (T):</b> ${car.ot} л</span>
                                </div>
                                <button class="btn-select-calc" onclick="event.stopPropagation(); selectForCalc('${id}')">Обрати для розрахунку</button>
                            </div>
                        </div>`;
                }
            }

            if (!hasCars) {
                html += `<div style="font-size:11px; color:#555; text-align:center; padding:10px;">Немає авто в цій категорії</div>`;
            }

            catBox.innerHTML = html;
            container.appendChild(catBox);
        });
    }

    function toggleDetails(id) {
        const el = document.getElementById('details-' + id);
        if (!el) return;
        const isVisible = el.style.display === 'block';
        document.querySelectorAll('.car-details').forEach(d => d.style.display = 'none');
        el.style.display = isVisible ? 'none' : 'block';
    }

    async function deleteCar(id) {
        if (confirm("Видалити цей автомобіль з бази?")) {
            const user = auth.currentUser;

            // Видаляємо з локальної бази
            let localDb = JSON.parse(localStorage.getItem('cars')) || {};
            delete localDb[id];
            localStorage.setItem('cars', JSON.stringify(localDb));

            // Видаляємо з хмари
            if (user) {
                try {
                    await db.collection('users').doc(user.uid).collection('cars').doc(id).delete();
                } catch (e) {
                    console.error(e);
                }
            }

            render();
        }
    }

    function selectForCalc(id) {
        let dbCars = JSON.parse(localStorage.getItem('cars')) || {};
        const car = dbCars[id];
        if (!car) return;

        localStorage.setItem('selectedCar', JSON.stringify(car));
        localStorage.setItem('selected_car_id', id);
        window.location.href = 'calc.html';
    }
</script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</body>
</html>
